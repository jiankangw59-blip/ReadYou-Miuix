name: Android Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # The Miuix AARs declare a minimum compileSdk of 37. The public SDK channel still ships 36,
      # so we install 36 and clone it to 37 with a patched ApiLevel (same trick used locally).
      - name: Provide compileSdk 37
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          # Runners ship the SDK; the deprecated `tools` package breaks setup-android@v3, so use the
          # preinstalled cmdline-tools directly.
          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n1)"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          if [ ! -d "$SDK/platforms/android-37" ]; then
            cp -r "$SDK/platforms/android-36" "$SDK/platforms/android-37"
            sed -i 's/^AndroidVersion.ApiLevel=.*/AndroidVersion.ApiLevel=37/' \
              "$SDK/platforms/android-37/source.properties"
            sed -i 's/^Pkg.Desc=.*/Pkg.Desc=Android SDK Platform 37/' \
              "$SDK/platforms/android-37/source.properties"
          fi
          echo "platforms: $(ls "$SDK/platforms")"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Prefer a stable keystore from Secrets. Without it we still ship an R8-optimised build by
      # generating an ephemeral key: the APK is smaller and faster, but its signature changes between
      # runs, so it cannot update an existing install in place.
      - name: Prepare signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPS: ${{ secrets.KEYSTORE_PROPS }}
        run: |
          mkdir -p signature
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > signature/release.jks
            printf '%s\n' "$KEYSTORE_PROPS" > signature/keystore_release.properties
            echo "Using keystore from Secrets."
          else
            keytool -genkeypair -v \
              -keystore signature/release.jks -alias readyou \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass readyou2024 -keypass readyou2024 \
              -dname "CN=ReadYou Miuix CI, OU=CI, O=GitHub Actions, L=NA, ST=NA, C=CN"
            printf '%s\n' \
              "storeFile=../signature/release.jks" \
              "storePassword=readyou2024" \
              "keyAlias=readyou" \
              "keyPassword=readyou2024" \
              > signature/keystore_release.properties
            echo "Generated an ephemeral keystore (add KEYSTORE_BASE64 for a stable signature)."
          fi

      - name: Build APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleGithubRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: readyou-miuix-apk
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: false
