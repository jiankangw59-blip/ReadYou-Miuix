name: Android Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The Miuix AARs declare a minimum compileSdk of 37. The public SDK channel still ships 36,
      # so we install 36 and clone it to 37 with a patched ApiLevel (same trick used locally).
      - name: Provide compileSdk 37
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          if [ ! -d "$SDK/platforms/android-37" ]; then
            cp -r "$SDK/platforms/android-36" "$SDK/platforms/android-37"
            sed -i 's/^AndroidVersion.ApiLevel=.*/AndroidVersion.ApiLevel=37/' \
              "$SDK/platforms/android-37/source.properties"
            sed -i 's/^Pkg.Desc=.*/Pkg.Desc=Android SDK Platform 37/' \
              "$SDK/platforms/android-37/source.properties"
          fi
          echo "platforms: $(ls "$SDK/platforms")"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing material
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPS: ${{ secrets.KEYSTORE_PROPS }}
        run: |
          mkdir -p signature
          echo "$KEYSTORE_BASE64" | base64 -d > signature/release.jks
          printf '%s\n' "$KEYSTORE_PROPS" > signature/keystore_release.properties

      - name: Build APK
        run: |
          set -euo pipefail
          if [ -f signature/keystore_release.properties ]; then
            ./gradlew :app:assembleGithubRelease --stacktrace
          else
            ./gradlew :app:assembleGithubDebug --stacktrace
          fi

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: readyou-miuix-apk
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
