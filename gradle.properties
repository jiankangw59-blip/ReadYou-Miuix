## Gradle / Android build configuration for the Read You + Miuix skin project.
# Build-performance notes live at the bottom of this file.

android.buildConfig=true
android.enableR8.fullMode=false
android.nonFinalResIds=true
android.nonTransitiveRClass=true
android.useAndroidX=true
# The Miuix AARs are built against API 37; the local SDK ships it as `android-37`.
android.suppressUnsupportedCompileSdk=37

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4096M -Xms512m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.vfs.watch=true

# ---- build performance ----
# Reuse task outputs (transformClassesWithAsm / dex / package are expensive and cacheable).
org.gradle.caching=true
# Skip re-configuring the whole build graph on every invocation (AGP 8.13 + KSP + Hilt are CC-safe).
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# Kotlin compiler runs in its own reusable daemon, so incremental state survives between builds.
kotlin.daemon.jvmargs=-Xmx4096M
kotlin.incremental=true
ksp.incremental=true
